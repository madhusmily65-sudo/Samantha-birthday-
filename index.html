<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Samantha! 🎉</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 40px;
    font-size: 2.2em;
    animation: pop 1.5s ease-in-out infinite alternate;
  }

  @keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  .subtitle {
    font-size: 1.1em;
    color: #f9c74f;
    margin-bottom: 30px;
  }

  .slideshow {
    position: relative;
    max-width: 90%;
    width: 400px;
    height: 400px;
    margin: 0 auto 40px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 200, 100, 0.4);
  }

  .slideshow img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: fade 12s infinite;
  }

  .slideshow img:nth-child(1) { animation-delay: 0s; }
  .slideshow img:nth-child(2) { animation-delay: 4s; }
  .slideshow img:nth-child(3) { animation-delay: 8s; }

  @keyframes fade {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    30%  { opacity: 1; }
    35%  { opacity: 0; }
    100% { opacity: 0; }
  }

  footer {
    padding: 30px;
    color: #aaa;
    font-size: 0.9em;
  }
</style>
</head>
<body>

  <h1>🎂 Happy Birthday Samantha! 🎉</h1>
  <div class="subtitle">Wishing you the happiest day ever 💛</div>

  <div class="slideshow">
    <img src="photo1.jpg" alt="Photo 1">
    <img src="photo2.jpg" alt="Photo 2">
    <img src="photo4.jpg" alt="Photo 4">
  </div>

  <footer>Made with ❤️ just for you</footer>

</body>
</html>
